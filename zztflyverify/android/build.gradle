group 'cn.fly.verify.flutter'
version '1.0.4'

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
    }
}
def mobCompileSdkVersion=31
try {
    if(mobCompileSdkVersion=flutter.compileSdkVersionif(rootProject.hasProperty("zzt-compileSdkVersion"))){
        mobCompileSdkVersion = Integer.parseInt(rootProject.getProperty('zzt-compilesdkVersion'))
    }
}catch(Throwable throwable){}

def mobTargetSdkVersion =31
try {
    if(mobTargetSdkVersion=flutter.targetSdkVersionif(rootProject.hasProperty("zzt-targetSdkVersion"))){
        mobTargetSdkVersion = Integer.parseInt(rootProject.getProperty('zzt-targetSdkVersion'))
    }
}catch(Throwable throwable){}

apply plugin: 'com.android.library'

android {
    compileSdkVersion mobCompileSdkVersion
    if (project.android.hasProperty("namespace")){
        namespace 'cn.fly.verify.flutter'
    }
    defaultConfig {
        minSdkVersion 16
        targetSdkVersion mobTargetSdkVersion
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}



dependencies {
    compileOnly fileTree(include: ['*.jar','*.aar'],dir: 'libs')
}