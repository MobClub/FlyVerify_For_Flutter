
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}
apply plugin: 'cn.fly.sdk'
FlySDK{
    FlyVerify{}
}
android {
    namespace 'cn.open.org'
    compileSdk 34
    defaultConfig {
        applicationId "cn.open.org"
        minSdk 19
        targetSdk 34
        versionCode 100004
        versionName "1.0.4"

    }
    signingConfigs {
        release {
            storeFile file("openid.jks")
            storePassword "open123"
            keyAlias "open"
            keyPassword "open123"
        }
        debug {
            storeFile file("openid.jks")
            storePassword "open123"
            keyAlias "open"
            keyPassword "open123"
        }
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false// 关闭资源压缩,否则未使用的drawable编译后会空
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar','*.jar'])
    implementation 'com.google.android.material:material:1.11.0'
}
